<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Task Manager</h1>
      <p>Manage your tasks and get an AI-powered summary of pending work.</p>
      <div class="stats">
        <span>Total: <strong id="totalCount">0</strong></span>
        <span>Pending: <strong id="pendingCount">0</strong></span>
        <span>Completed: <strong id="completedCount">0</strong></span>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Add Task</h2>
        <form id="taskForm">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Enter task title" maxlength="100" required>

          <label for="description">Description</label>
          <textarea id="description" placeholder="Enter task description" maxlength="500"></textarea>

          <button type="submit">Add Task</button>
        </form>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Tasks</h2>
          <div class="search-row">
            <input id="searchInput" type="search" placeholder="Search by title...">
            <button id="clearSearch" class="secondary" type="button">Clear</button>
          </div>
        </div>

        <div id="message" class="message hidden"></div>
        <div id="taskList"></div>
        <div id="emptyState" class="empty">No tasks found.</div>
      </section>

      <section class="card ai-card">
        <div class="section-heading">
          <div>
            <h2>AI Summary</h2>
            <p>Generate a concise summary of your pending tasks.</p>
          </div>
          <button id="summaryBtn" type="button">Generate AI Summary</button>
        </div>
        <div id="summaryBox" class="summary hidden">
          <p id="summaryText"></p>
        </div>
      </section>
    </main>

    <footer>Full Stack AI Intern Assessment • HTML, CSS & JavaScript</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
